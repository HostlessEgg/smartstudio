name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartstudio_lms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: smartstudio_lms
      RATE_LIMITS_DISABLED: '1'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install mysql client (for migration script)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply DB migrations
        working-directory: backend
        run: |
          chmod +x ./scripts/run_migrations.sh
          ./scripts/run_migrations.sh

      - name: Run backend seeders
        working-directory: backend
        run: |
          node scripts/seed_sample_data.js
          node scripts/seed_additional_data.js

      - name: Start backend server
        working-directory: backend
        run: |
          nohup node server.js > server.log 2>&1 &
          # wait for server to accept connections
          for i in {1..30}; do
            nc -z 127.0.0.1 5000 && break || sleep 1
          done

      - name: Run backend tests (Jest)
        working-directory: backend
        env:
          RATE_LIMITS_DISABLED: '1'
        run: npm test --silent

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests (Vitest)
        working-directory: frontend
        run: npm test --silent
